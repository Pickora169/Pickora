<section class="sec news" id="newsletter">
  <div class="wrap">
    <h2>Make Smarter Shopping Decisions.</h2>
    <p>Get useful product discoveries, buying guides and carefully selected recommendations.</p>
    {% if site.newsletter_endpoint != "" %}
    <form method="post" action="{{ site.newsletter_endpoint }}">
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="sr" for="nl-email">Email address</label>
      <input type="email" id="nl-email" name="email" placeholder="you@example.com" required>
      <button class="btn" type="submit">Subscribe</button>
    </form>
    {% else %}<p class="note">Newsletter form not connected yet. Set <code>newsletter_endpoint</code> in _config.yml.</p>{% endif %}
  </div>
</section>
